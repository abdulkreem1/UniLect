# Example nginx site for UniLect (TLS termination + protected file delivery).
upstream unilect_api { server 127.0.0.1:8000; }

server {
    listen 443 ssl http2;
    server_name api.example.com;
    # ssl_certificate / ssl_certificate_key ...

    client_max_body_size 210m;          # >= CONTENT_MAX_UPLOAD_MB_HARD_LIMIT (+ form overhead)

    location /static/ { alias /srv/unilect/staticfiles/; }

    # Private files: reachable ONLY through X-Accel-Redirect issued by Django
    # after authorisation. Set PRIVATE_MEDIA_ACCEL_PREFIX=/protected-media/
    location /protected-media/ {
        internal;
        alias /srv/unilect/private_media/;   # == PRIVATE_MEDIA_ROOT
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://unilect_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (never append) so clients cannot spoof their IP in audit logs.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server { listen 80; server_name api.example.com; return 301 https://$host$request_uri; }
