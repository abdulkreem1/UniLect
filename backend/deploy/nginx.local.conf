# nginx for the production-like local stack (plain HTTP; TLS terminates in front of this in real deployments).
upstream unilect_api { server api:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 210m;

    location /static/ { alias /srv/unilect/staticfiles/; }

    # Reachable ONLY through X-Accel-Redirect issued by Django after authorisation.
    location /protected-media/ {
        internal;
        alias /srv/unilect/private_media/;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://unilect_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite: clients cannot spoof
    }
}
