openapi: 3.0.3
info:
  title: UniLect API
  version: 1.0.0
  description: Protected academic content platform (students, libraries, administrators).
paths:
  /api/v1/admin/audit-logs/:
    get:
      operationId: admin_audit_logs_list
      description: 'FR-015 / FR-068: read-only audit trail. Device history: ``?category=device``.'
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: action_prefix
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
          format: uuid
      - in: query
        name: category
        schema:
          type: string
          enum:
          - account
          - auth
          - catalog
          - content
          - device
          - library
          - report
          - security
          - settings
        description: |-
          * `account` - Account
          * `auth` - Authentication
          * `device` - Device
          * `catalog` - Catalog
          * `library` - Library
          * `content` - Content
          * `report` - Report
          * `settings` - Settings
          * `security` - Security
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: كلمات البحث (يجب أن تتطابق جميعها). يتم تجاهل اختلاف أشكال الحروف
          والتشكيل.
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin/audit-logs/{id}/:
    get:
      operationId: admin_audit_logs_retrieve
      description: 'FR-015 / FR-068: read-only audit trail. Device history: ``?category=device``.'
      parameters:
