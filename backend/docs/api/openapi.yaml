  /api/v1/me/notifications/:
    get:
      operationId: me_notifications_list
      description: 'Notification centre: each user only ever sees their own notifications
        (FR-072).'
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - content_review
          - device_change_approved
          - device_change_rejected
          - new_content
          - report_update
          - system
        description: |-
          * `device_change_approved` - Device change approved
          * `device_change_rejected` - Device change rejected
          * `new_content` - New content
          * `content_review` - Content review decision
          * `report_update` - Report update
          * `system` - System
      - in: query
        name: unread
        schema:
          type: boolean
      tags:
      - me
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
