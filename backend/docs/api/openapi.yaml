        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: reason
        schema:
          type: string
          enum:
          - duplicate
          - inappropriate
          - other
          - wrong
        description: |-
          * `wrong` - Wrong or incorrect file
          * `duplicate` - Duplicate
          * `inappropriate` - Inappropriate
          * `other` - Other
      - in: query
        name: status
        schema:
          type: string
          enum:
          - in_review
          - open
          - rejected
          - resolved
        description: |-
          * `open` - Open
          * `in_review` - In review
          * `resolved` - Resolved
          * `rejected` - Rejected
