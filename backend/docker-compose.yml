# Local development services. The Django app runs on the host (see README).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unilect
      POSTGRES_USER: unilect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unilect-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unilect -d unilect"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
