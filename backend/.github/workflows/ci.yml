name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unilect
          POSTGRES_USER: unilect
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unilect -d unilect"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgres://unilect:ci-only-password@127.0.0.1:5432/unilect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Lint & format
        run: ruff check . && ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid and committed copy is current
        run: |
          python manage.py spectacular --validate --fail-on-warn --file /tmp/openapi.yaml
          diff -u docs/api/openapi.yaml /tmp/openapi.yaml
      - name: Tests (with coverage gate)
        run: python -m pytest --create-db --cov
      - name: Production settings pass deploy checks
        env:
          DJANGO_SETTINGS_MODULE: unilect.settings.prod
          ALLOWED_HOSTS: api.example.com
          CACHE_URL: redis://localhost:6379/1
        run: python manage.py check --deploy --fail-level WARNING

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t unilect-api:ci .
